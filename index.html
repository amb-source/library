<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMB-Library | Advanced Tools Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #080a0f;
            --card-bg: rgba(17, 24, 39, 0.7);
            --primary: #8b5cf6;
            --primary-glow: rgba(139, 92, 246, 0.3);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent: #10b981;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% -20%, #1e1b4b 0%, var(--bg-dark) 80%);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Header & Navigation */
        header {
            padding: 60px 20px;
            text-align: center;
            max-width: 900px;
            margin: 0 auto;
        }

        .logo {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 10px;
            background: linear-gradient(to right, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Search Box Design */
        .search-container {
            position: relative;
            margin: 30px auto;
            max-width: 600px;
        }

        .search-bar {
            width: 100%;
            padding: 18px 25px;
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            color: #fff;
            font-size: 1.1rem;
            backdrop-filter: blur(12px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .search-bar:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
            transform: scale(1.02);
        }

        /* Filter Chips */
        .categories {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 8px 20px;
            border-radius: 100px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.3s;
        }

        .filter-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        /* Tools Grid */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            padding: 0 20px 60px;
            max-width: 1300px;
            margin: 0 auto;
        }

        /* Glass Card Effect */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px;
            backdrop-filter: blur(10px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(45deg, transparent, rgba(139, 92, 246, 0.05));
            pointer-events: none;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: rgba(139, 92, 246, 0.5);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .card-icon {
            width: 64px; height: 64px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 18px;
            margin-bottom: 20px;
            display: flex;
            align-items: center; justify-content: center;
            padding: 12px;
        }

        .card-icon img { width: 100%; height: 100%; object-fit: contain; }

        .card-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 8px; }
        
        .badge {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 15px;
            display: inline-block;
        }

        .card-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 25px;
            flex-grow: 1;
        }

        .btn-visit {
            background: #fff;
            color: #000;
            text-decoration: none;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-visit:hover { background: var(--primary); color: #fff; }

        /* No Results State */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 100px 0;
            color: var(--text-muted);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card { animation: fadeIn 0.5s ease backwards; }
    </style>
</head>
<body>

            <button class="filter-btn" data-filter="Browsers">Browsers</button>

    </header>

    <main class="grid-container" id="toolsGrid">

            { name: "Trello", category: "Productivity", desc: "Visual tool that empowers your team to manage any type of project or workflow.", url: "https://trello.com/", icon: "https://www.google.com/s2/favicons?domain=trello.com&sz=128" },
            { name: "Linear", category: "Productivity", desc: "A better way to build products. Issue tracking designed to be fast and beautiful.", url: "https://linear.app/", icon: "https://www.google.com/s2/favicons?domain=linear.app&sz=128" },

            { name: "Miro", category: "Productivity", desc: "The visual collaboration platform for every team.", url: "https://miro.com/", icon: "https://www.google.com/s2/favicons?domain=miro.com&sz=128" }
        ];        
        
        // Library Controller Module
        const App = {
            init() {
                this.grid = document.getElementById('toolsGrid');
                this.searchInput = document.getElementById('searchInput');
                this.filterButtons = document.querySelectorAll('.filter-btn');
                
                this.addEventListeners();
                this.render(TOOLS_DATA);
            },

            // Debounce function to optimize search performance
            debounce(fn, delay = 300) {
                let timeout;
                return (...args) => {
                    clearTimeout(timeout);
                    timeout = setTimeout(() => fn.apply(this, args), delay);
                };
            },

            addEventListeners() {
                this.searchInput.addEventListener('input', this.debounce(() => this.handleFilter()));
                
                this.filterButtons.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.filterButtons.forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.handleFilter();
                    });
                });
            },

            handleFilter() {
                const query = this.searchInput.value.toLowerCase();
                const category = document.querySelector('.filter-btn.active').dataset.filter;

                const filtered = TOOLS_DATA.filter(tool => {
                    const matchesSearch = tool.name.toLowerCase().includes(query) || 
                                          tool.desc.toLowerCase().includes(query);
                    const matchesCat = category === 'all' || tool.category === category;
                    return matchesSearch && matchesCat;
                });

                this.render(filtered);
            },

            render(data) {
                if (data.length === 0) {
                    this.grid.innerHTML = `
                        <div class="empty-state">
                            <h3>No tools found</h3>
                            <p>Try searching for something else or change the category.</p>
                        </div>`;
                    return;
                }

                this.grid.innerHTML = data.map((tool, index) => `
                    <article class="card" style="animation-delay: ${index * 0.05}s">
                        <div class="card-icon">
                            <img src="${tool.icon}" alt="${tool.name}" loading="lazy">
                        </div>
                        <span class="badge">${tool.category}</span>
                        <h3 class="card-title">${tool.name}</h3>
                        <p class="card-desc">${tool.desc}</p>
                        <a href="${tool.url}" target="_blank" rel="noopener" class="btn-visit">Visit Platform</a>
                    </article>
                `).join('');
            }
        };

        // Boot the App
        document.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>
</html>
